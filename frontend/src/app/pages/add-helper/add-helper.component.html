<nav>
  <mat-toolbar>
    <a [routerLink]="['/home']" class="back-button">
      <mat-icon>keyboard_arrow_left</mat-icon>
      <span>Add Helper</span>
    </a>
  </mat-toolbar>
</nav>
<mat-stepper class="stepper-container" [linear]="true" #stepper>
  <mat-step [stepControl]="helperForm" [editable]="true">
    <ng-template matStepLabel>Helper Details</ng-template>
    <mat-card class="form-content">
     <app-helper-form
      [helperForm]="helperForm"
      [useCase]="'add-helper'"
     ></app-helper-form>
  </mat-card>
  </mat-step>
  
  <mat-step [stepControl]="helperForm" [optional]="true">
    <ng-template matStepLabel>Documents</ng-template>
    <mat-card class="form-content">
      <app-additional-form
      [helperForm]="helperForm"
      [useCase]="'add-helper'"
      ></app-additional-form>
    </mat-card>
  </mat-step>
  
  <mat-step [stepControl]="helperForm">
  <ng-template matStepLabel>Review</ng-template>
  <mat-card class="form-content">
    <app-add-helper-review [helperForm]="helperForm"></app-add-helper-review>
    <div class="btn-container">
      <button mat-raised-button color="primary" matStepperPrevious>Previous</button>
      <button mat-raised-button color="primary" (click)="onFormSubmit()" [disabled]="helperForm.invalid">+ Add Helper</button>
    </div>
  </mat-card>
  
</mat-step>

</mat-stepper>
